<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kültür Atlası | Premium Gold</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --font-primary: 'Manrope', sans-serif;
            --bg-gradient: radial-gradient(circle at center, #0a1f16 0%, #020504 100%);
            --panel-bg: rgba(12, 28, 20, 0.65);
            --panel-border: rgba(0, 200, 120, 0.3);
            --primary-accent: #00c878;
            --primary-glow: rgba(0, 200, 120, 0.6);
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --option-bg: linear-gradient(145deg, rgba(15, 37, 27, 0.7) 0%, rgba(10, 25, 18, 0.9) 100%);
            --option-border: rgba(0, 200, 120, 0.4);
            --option-hover-bg: rgba(0, 200, 120, 0.2);
            --correct-color: #00ff88;
            --wrong-color: #ff3366;
            --glass-blur: blur(20px);
        }

        [data-theme="light"] {
            --bg-gradient: radial-gradient(circle at center, #ffffff 0%, #e8f0eb 100%);
            --panel-bg: rgba(255, 255, 255, 0.8);
            --panel-border: rgba(0, 160, 100, 0.2);
            --primary-accent: #00a064;
            --primary-glow: rgba(0, 160, 100, 0.3);
            --text-main: #0f172a;
            --text-muted: #475569;
            --option-bg: linear-gradient(145deg, rgba(255, 255, 255, 0.9) 0%, rgba(240, 245, 242, 0.9) 100%);
            --option-border: rgba(0, 160, 100, 0.3);
            --option-hover-bg: rgba(0, 160, 100, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body {
            font-family: var(--font-primary);
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #particleCanvas {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1; pointer-events: none;
        }

        .app-container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 1050px;
            min-height: 85vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .app-header {
            display: flex; justify-content: space-between; align-items: center;
            padding-bottom: 20px; border-bottom: 1px solid var(--panel-border); margin-bottom: 30px;
        }

        .logo-title {
            font-size: 2rem; font-weight: 800; letter-spacing: 4px;
            background: linear-gradient(45deg, var(--text-main), var(--primary-accent));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .logo-subtitle { display: block; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 3px; color: var(--primary-accent); }
        
        .audio-controls {
            display: flex; align-items: center; gap: 12px;
            background: var(--panel-bg); padding: 8px 16px;
            border-radius: 40px; border: 1px solid var(--panel-border);
            backdrop-filter: var(--glass-blur);
        }

        .volume-sliders input { width: 80px; height: 4px; accent-color: var(--primary-accent); cursor: pointer; }

        .icon-btn {
            background: transparent; border: none; cursor: pointer;
            width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
            border-radius: 50%; transition: all 0.3s ease;
        }
        .icon-btn svg { width: 22px; height: 22px; fill: var(--text-main); }

        .glass-panel {
            background: var(--panel-bg);
            backdrop-filter: var(--glass-blur);
            border: 1px solid var(--panel-border); border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
        }

        .screen-card { text-align: center; padding: 50px 40px; max-width: 700px; margin: 0 auto; }
        .state-view { display: none; opacity: 0; transform: translateY(20px); transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
        .state-view.visible { display: block; opacity: 1; transform: translateY(0); }

        .brand-title { font-size: 2.5rem; font-weight: 800; margin-bottom: 20px; letter-spacing: 3px; }
        .brand-desc { color: var(--text-muted); font-size: 1.1rem; line-height: 1.7; margin-bottom: 40px; }

        .action-btn {
            font-family: var(--font-primary); font-weight: 800; text-transform: uppercase;
            padding: 16px 45px; border-radius: 40px; border: none; cursor: pointer;
            letter-spacing: 3px; font-size: 1.1rem; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glow-btn { background: var(--primary-accent); color: #000; box-shadow: 0 0 20px var(--primary-glow); }
        .glow-btn:hover { transform: translateY(-3px) scale(1.05); }

        .cinematic-counter {
            font-size: 10rem; font-weight: 800; text-align: center; color: var(--primary-accent);
            text-shadow: 0 0 50px var(--primary-glow);
            animation: zoomPulse 1s infinite;
        }
        @keyframes zoomPulse { 0% { transform: scale(0.5); opacity: 0; } 50% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(1); opacity: 0; } }

        .gameplay-hud { display: flex; justify-content: space-between; align-items: center; gap: 20px; margin-bottom: 30px; }
        .progress-container { flex: 1; }
        .progress-bar-wrapper { background: rgba(255, 255, 255, 0.05); height: 10px; border-radius: 5px; overflow: hidden; }
        .progress-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #007744, var(--primary-accent)); transition: width 0.5s ease; }

        .timer-circle {
            width: 65px; height: 65px; border-radius: 50%; border: 4px solid var(--primary-accent);
            display: flex; justify-content: center; align-items: center; font-weight: 800; font-size: 1.5rem;
        }
        .timer-panic { border-color: var(--wrong-color); color: var(--wrong-color); animation: panic 0.4s infinite alternate; }
        @keyframes panic { from { transform: scale(1); } to { transform: scale(1.1); } }

        .lifeline-btn {
            background: var(--panel-bg); color: var(--text-main); border: 1px solid var(--option-border);
            padding: 8px 16px; border-radius: 20px; cursor: pointer; font-size: 0.8rem; font-weight: 700; margin-left: 5px;
            transition: all 0.2s ease;
        }
        .lifeline-btn:disabled { opacity: 0.15; cursor: not-allowed; box-shadow: none !important; }

        /* TANRISAL JOKER ÖZEL GLOW EFFECT */
        .tanrisal-glow {
            border-color: #ffd700 !important;
            color: #ffd700 !important;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.2);
            font-weight: 800;
        }
        .tanrisal-glow:hover:not(:disabled) {
            background: rgba(255, 215, 0, 0.15) !important;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5) !important;
            transform: translateY(-2px);
        }
        /* KİLİTLİ / AKTİF OLMAYAN DURUM */
        .tanrisal-glow:disabled {
            opacity: 0.15 !important;
            box-shadow: none !important;
            border-color: var(--option-border) !important;
            color: var(--text-muted) !important;
            cursor: not-allowed;
        }

        .question-board { padding: 45px; min-height: 320px; display: flex; flex-direction: column; justify-content: center; }
        .question-metadata { display: flex; gap: 12px; margin-bottom: 20px; }
        .badge { font-size: 0.75rem; text-transform: uppercase; font-weight: 800; padding: 5px 12px; border-radius: 12px; background: rgba(0, 200, 120, 0.15); border: 1px solid var(--primary-accent); color: var(--primary-accent); }
        
        .question-statement { font-size: 1.5rem; font-weight: 600; line-height: 1.6; margin-bottom: 35px; }
        .options-grid { display: grid; grid-template-columns: 1fr; gap: 15px; }
        @media (min-width: 768px) { .options-grid { grid-template-columns: repeat(2, 1fr); } }

        .option-node {
            background: var(--option-bg); border: 2px solid var(--option-border); color: var(--text-main);
            padding: 18px 25px; border-radius: 15px; text-align: left; font-size: 1.1rem; font-weight: 600; cursor: pointer;
            transition: all 0.2s ease; position: relative;
        }
        .option-node:hover:not(.disabled) { border-color: var(--primary-accent); background: var(--option-hover-bg); }
        
        /* SEÇİLEN ŞIKKIN KİLİTLENME VE TİK TAK SÜRECİNDEKİ YANIP SÖNME ANİMASYONU */
        .option-node.selected-lock { 
            background: rgba(230, 180, 0, 0.25) !important; 
            border-color: #ffd700 !important;
            animation: lockPulse 0.5s infinite alternate;
        }
        @keyframes lockPulse { from { opacity: 0.7; } to { opacity: 1; } }
        
        .option-node.reveal-correct { background: rgba(0, 255, 136, 0.4) !important; border-color: var(--correct-color) !important; }
        .option-node.reveal-wrong { background: rgba(255, 51, 102, 0.4) !important; border-color: var(--wrong-color) !important; }
        .option-node.eliminated-fifty { opacity: 0.1; pointer-events: none; }

        .metrics-dashboard { margin: 25px 0; text-align: left; background: rgba(0,0,0,0.2); padding: 20px; border-radius: 15px; }
        .metrics-table { width: 100%; }
        .metrics-table td { padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .metrics-table td:last-child { text-align: right; font-weight: 800; color: var(--primary-accent); }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); z-index: 100; display: flex; justify-content: center; align-items: center; }
        .modal-content { padding: 35px; max-width: 450px; width: 95%; text-align: center; border-radius: 25px; }

        .app-footer { text-align: center; padding-top: 20px; font-size: 0.9rem; color: var(--text-muted); }
        
        /* PREMIUM BERAT TEXT EFEKTİ */
        .premium-berat {
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(45deg, #00ff88, #00c878, #00ffff, #00ff88);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientShift 4s ease infinite, premiumGlow 2s infinite alternate;
        }
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        @keyframes premiumGlow {
            from { text-shadow: 0 0 4px rgba(0,200,120,0.2); }
            to { text-shadow: 0 0 12px rgba(0,255,136,0.6); }
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <canvas id="particleCanvas"></canvas>

    <div class="app-container">
        <header class="app-header">
            <div>
                <span class="logo-title">KÜLTÜR ATLASI</span>

                <div class="audio-controls">
                    <button id="toggleSoundBtn" class="icon-btn">🔊</button>
                    <input type="range" id="sfxVol" min="0" max="1" step="0.1" value="0.5">
                </div>
                <button id="themeToggleBtn" class="icon-btn" style="background: rgba(255,255,255,0.1);">🌓</button>
            </div>
        </header>

        <main>
            <!-- GİRİŞ EKRANI -->
            <section id="welcomeState" class="state-view screen-card glass-panel visible">
                <h1 class="brand-title">KÜLTÜR ATLASI</h1>
                <p class="brand-desc">6 ana disipline dengelenmiş, benzersiz algoritmalarla donatılmış kesintisiz entelektüel mücadele.</p>
                <button id="startGameBtn" class="action-btn glow-btn">YARIŞMAYA BAŞLA</button>
            </section>

            <!-- GERİ SAYIM -->
            <section id="countdownState" class="state-view hidden">
                <div id="countdownNumber" class="cinematic-counter">3</div>
            </section>

            <!-- OYUN ALANI -->

                        <span class="progress-text" style="font-size: 0.9rem; color: var(--text-muted);">Soru: <b id="currentQuestionNum">1</b>/15</span>

                    </div>
                    <div id="timerDisplay" class="timer-circle">60</div>
                    <div class="lifelines-container">
                        <button id="jokerFifty" class="lifeline-btn">50:50</button>

                    </div>
                </div>

                <div class="question-board glass-panel">
                    <div class="question-metadata">
                        <span id="questionCategory" class="badge">Kategori</span>
                        <span id="questionDifficulty" class="badge">Zorluk</span>

                    <h2 id="questionText" class="question-statement">Yükleniyor...</h2>

            </section>

            <section id="resultsState" class="state-view screen-card glass-panel hidden">

                <div class="metrics-dashboard">
                    <table class="metrics-table">
                        <tbody>
                            <tr><td>Doğru Cevap Sayısı</td><td id="metricAccuracy">0/15</td></tr>
                            <tr><td>Toplam Puan</td><td id="metricScore">0</td></tr>
                        </tbody>
                    </table>
                </div>
                <button id="restartGameBtn" class="action-btn glow-btn">YENİ TUR BAŞLAT</button>
            </section>
        </main>

        <footer class="app-footer">
            <span>Made by <span class="premium-berat">BERAT</span></span>
        </footer>
    </div>

    <!-- MODAL -->
    <div id="globalModal" class="modal-overlay hidden">
        <div class="modal-content glass-panel">
            <h3 id="modalTitle" style="color: var(--primary-accent); margin-bottom: 15px;">İpucu</h3>
            <p id="modalBody" style="margin-bottom: 25px; line-height: 1.6;"></p>
            <button id="modalCloseBtn" class="action-btn glow-btn" style="padding: 10px 30px; font-size: 0.9rem;">KAPAT</button>
        </div>
    </div>

    <script>
        // --- TICK-TOCK SES EFEKTLERİ MOTORU ---
        class AudioEngine {
            constructor() {
                this.ctx = null;
                this.muted = false;
                this.vol = 0.5;
            }
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }
            playTone(freq, type, dur, volume) {
                if (!this.ctx || this.muted) return;
                let osc = this.ctx.createOscillator();
                let gain = this.ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                gain.gain.setValueAtTime(volume * this.vol, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + dur);
            }
            tick(panic) { this.playTone(panic ? 900 : 600, 'sine', 0.05, 0.15); }
            suspenseTick() { this.playTone(750, 'triangle', 0.06, 0.25); }
            correct() { this.playTone(523, 'sine', 0.15, 0.3); setTimeout(() => this.playTone(659, 'sine', 0.2, 0.3), 100); }
            wrong() { this.playTone(150, 'sawtooth', 0.4, 0.4); }
            lock() { this.playTone(280, 'triangle', 0.15, 0.3); }
        }

                { id: "s4", target: "Düşünen Adam", event: "Cehennem Kapısı projesinin bir parçası olarak tasarlanan bronz döküm figür", region: "Modern Heykel", hint: "Auguste Rodin'in derin bir felsefi tefekkür halindeki insan anatomisini işlediği kült yapıt." },
                { id: "s5", target: "Yıldızlı Gece", event: "Akıl hastanesi penceresinden görülen gökyüzünün girdap şeklinde boyanması", region: "Post-Empresyonizm", hint: "Vincent van Gogh'un intiharından kısa süre önce sarı ve mavi zıtlığıyla ürettiği şaheser." },
                { id: "s6", talk: "Gece Nöbeti", event: "Yüzbaşı Banninck Cocq ve müfreze üyelerinin dinamik kompozisyonu", region: "Hollanda Altın Çağı", hint: "Rembrandt'ın gölge-ışık (chiaroscuro) tekniğinde devrim yarattığı devasa boyutlu grup portresi." },
                { id: "s7", target: "Atina Okulu", event: "Platon ve Aristoteles'in merkezde felsefi tartışma yürüttüğü fresk yapısı", region: "Vatikan Sarayı", hint: "Raffaello Sanzio'nun Antik Çağ filozoflarını aynı çatı altında resmettiği Rönesans zirvesi." }
            ]
        };

        const TEMPLATES = [
            "Evrensel bilgi arşivlerinde #REGION koordinatlarında incelenen ve yapısal olarak '#EVENT' devrimi ile doğrudan özdeşleşen temel başlık hangisidir?",
            "Akademik araştırmalarda kritik bir dönüm noktası kabul edilen; #REGION sınırlarında ortaya çıkıp doğrudan '#EVENT' olgusunu tetikleyen kavram veya eser hangisidir?",
            "Kültürel literatürde benzersiz bir konuma sahip olan, odak noktasına '#EVENT' durumunu alan ve çıkış ekosistemi #REGION olan şaheser veya fenomen hangisidir?"
        ];

        // --- ARKA PLAN ENGINE ---
        class AtlasEngine {
            constructor() {
                this.audio = new AudioEngine();
                this.roundQuestions = [];
                this.currentIndex = 0;
                this.score = 0;
                this.timerVal = 60;
                this.timerInterval = null;
                this.startTime = null;
                this.jokers = { fifty: false, hint: false, godly: false };

                this.views = {
                    welcome: document.getElementById('welcomeState'),
                    countdown: document.getElementById('countdownState'),
                    gameplay: document.getElementById('gameplayState'),
                    results: document.getElementById('resultsState'),
                    modal: document.getElementById('globalModal')
                };
            }

            init() {
                document.getElementById('startGameBtn').addEventListener('click', () => { this.audio.init(); this.startCountdown(); });
                document.getElementById('restartGameBtn').addEventListener('click', () => { this.audio.playTone(400,'sine',0.1,0.2); this.resetToWelcome(); });
                document.getElementById('modalCloseBtn').addEventListener('click', () => { this.views.modal.classList.add('hidden'); });
                document.getElementById('jokerFifty').addEventListener('click', () => this.triggerFiftyFifty());
                document.getElementById('jokerHint').addEventListener('click', () => this.triggerHint());
                document.getElementById('jokerGodly').addEventListener('click', () => this.triggerGodly());
                document.getElementById('themeToggleBtn').addEventListener('click', () => this.toggleTheme());

                this.initBackgroundParticles();
            }

            getBannedIds() {
                return JSON.parse(localStorage.getItem('atlas_banned_questions_v2')) || [];
            }

            saveBannedId(id) {
                let banned = this.getBannedIds();
                if (!banned.includes(id)) {
                    banned.push(id);
                    localStorage.setItem('atlas_banned_questions_v2', JSON.stringify(banned));
                }
            }

            toggleTheme() {
                const cur = document.documentElement.getAttribute('data-theme');
                document.documentElement.setAttribute('data-theme', cur === 'light' ? 'dark' : 'light');
            }

            initBackgroundParticles() {
                const canvas = document.getElementById('particleCanvas');
                const ctx = canvas.getContext('2d');
                let pts = [];
                const res = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };
                window.addEventListener('resize', res); res();
                for(let i=0; i<30; i++) pts.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, r: Math.random()*1.5+1, s: Math.random()*0.2+0.05 });
                const render = () => {
                    ctx.clearRect(0,0,canvas.width,canvas.height);
                    ctx.fillStyle = 'rgba(0, 200, 120, 0.2)';
                    pts.forEach(p => {
                        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
                        p.y -= p.s; if(p.y < 0) p.y = canvas.height;
                    });
                    requestAnimationFrame(render);
                };
                render();
            }

            buildRoundQuestions() {
                let bannedIds = this.getBannedIds();
                let categories = Object.keys(MASTER_DATA);
                let roundList = [];
                
                let totalItems = 0;
                categories.forEach(c => totalItems += MASTER_DATA[c].length);
                
                if (bannedIds.length >= totalItems - 15) {
                    localStorage.removeItem('atlas_banned_questions_v2');
                    bannedIds = [];
                }

                let catIndexPointer = 0;
                let securityCounter = 0;

                while (roundList.length < 15 && securityCounter < 500) {
                    securityCounter++;
                    let currentCat = categories[catIndexPointer % categories.length];
                    let rawItems = MASTER_DATA[currentCat];
                    
                    let availableItems = rawItems.filter(item => !bannedIds.includes(item.id) && !roundList.some(r => r.id === item.id));

                    if (availableItems.length === 0) {
                        availableItems = rawItems.filter(item => !roundList.some(r => r.id === item.id));
                    }

                    if (availableItems.length > 0) {
                        let chosenItem = availableItems[Math.floor(Math.random() * availableItems.length)];
                        let otherTargets = rawItems.filter(x => x.target !== chosenItem.target).map(x => x.target);
                        otherTargets.sort(() => 0.5 - Math.random());
                        
                        let finalOptions = [chosenItem.target, otherTargets[0], otherTargets[1], otherTargets[2]];
                        finalOptions.sort(() => 0.5 - Math.random());

                        let template = TEMPLATES[Math.floor(Math.random() * TEMPLATES.length)];
                        let formattedText = template.replace("#EVENT", chosenItem.event).replace("#REGION", chosenItem.region);

                        roundList.push({
                            id: chosenItem.id,
                            category: currentCat,
                            difficulty: Math.random() > 0.5 ? "Zor" : "Orta",
                            question: formattedText,
                            options: finalOptions,
                            correct: finalOptions.indexOf(chosenItem.target),
                            hint: chosenItem.hint
                        });

                        catIndexPointer++;
                    } else {
                        catIndexPointer++;
                    }
                }
                
                this.roundQuestions = roundList;
            }

            showView(key) {
                Object.keys(this.views).forEach(k => { if(k !== 'modal') this.views[k].classList.replace('visible', 'hidden'); });
                this.views[key].classList.replace('hidden', 'visible');
            }

            startCountdown() {
                this.showView('countdown');
                let c = 3;
                const el = document.getElementById('countdownNumber');
                const loop = () => {
                    if(c > 0) {
                        el.innerText = c;
                        this.audio.playTone(440, 'sine', 0.1, 0.3);
                        c--; setTimeout(loop, 1000);
                    } else {
                        this.startGameEngine();
                    }
                };
                loop();
            }

            startGameEngine() {
                this.buildRoundQuestions();
                this.currentIndex = 0;
                this.score = 0;
                this.startTime = Date.now();
                this.jokers = { fifty: false, hint: false, godly: false };
                document.getElementById('jokerFifty').disabled = false;
                
                this.showView('gameplay');
                this.loadActiveQuestion();
            }

            loadActiveQuestion() {
                const q = this.roundQuestions[this.currentIndex];
                this.saveBannedId(q.id);

                document.getElementById('currentQuestionNum').innerText = this.currentIndex + 1;
                document.getElementById('progressBarFill').style.width = `${((this.currentIndex + 1) / 15) * 100}%`;
                document.getElementById('questionCategory').innerText = q.category;
                document.getElementById('questionDifficulty').innerText = q.difficulty;
                document.getElementById('questionText').innerText = q.question;

                const grid = document.getElementById('optionsGrid');
                grid.innerHTML = '';
                
                q.options.forEach((opt, idx) => {
                    const btn = document.createElement('button');
                    btn.className = 'option-node';
                    btn.innerHTML = `<span style="color:var(--primary-accent); font-weight:800; margin-right:8px;">${String.fromCharCode(65+idx)}:</span> ${opt}`;
                    btn.addEventListener('click', () => this.handleSelection(idx));
                    grid.appendChild(btn);
                });

                // Jokerlerin Aktiflik Kontrolü
                document.getElementById('jokerHint').disabled = (this.currentIndex < 2 || this.jokers.hint);
                
                // TANRISAL JOKER KONTROLÜ: 10. sorudan sonra (11. soru ve sonrası, yani index >= 10) aktif olur.
                document.getElementById('jokerGodly').disabled = (this.currentIndex < 10 || this.jokers.godly);

                this.startTimerSystem();
            }

            startTimerSystem() {
                clearInterval(this.timerInterval);
                this.timerVal = 60;
                const el = document.getElementById('timerDisplay');
                el.innerText = this.timerVal;
                el.classList.remove('timer-panic');

                this.timerInterval = setInterval(() => {
                    this.timerVal--;
                    el.innerText = this.timerVal;
                    this.audio.tick(this.timerVal <= 15);

                    if(this.timerVal <= 15) el.classList.add('timer-panic');
                    if(this.timerVal <= 0) { clearInterval(this.timerInterval); this.endGameSequence(false); }
                }, 1000);
            }

            handleSelection(idx) {
                clearInterval(this.timerInterval);
                this.audio.lock();

                const nodes = document.getElementById('optionsGrid').children;
                for(let n of nodes) n.style.pointerEvents = 'none';
                nodes[idx].classList.add('selected-lock');

                let elapsedSuspense = 0;
                const suspenseInterval = setInterval(() => {
                    elapsedSuspense++;
                    if (elapsedSuspense < 3) {
                        this.audio.suspenseTick();
                    } else {
                        clearInterval(suspenseInterval);
                        
                        const q = this.roundQuestions[this.currentIndex];
                        if (idx === q.correct) {
                            nodes[idx].classList.replace('selected-lock', 'reveal-correct');
                            this.audio.correct();
                            this.score += 300 + (this.timerVal * 15);
                            this.currentIndex++;
                            
                            setTimeout(() => {
                                if (this.currentIndex >= 15) this.endGameSequence(true);
                                else this.loadActiveQuestion();
                            }, 2000);
                        } else {
                            nodes[idx].classList.replace('selected-lock', 'reveal-wrong');
                            nodes[q.correct].classList.add('reveal-correct');
                            this.audio.wrong();
                            setTimeout(() => this.endGameSequence(false), 2500);
                        }
                    }
                }, 1000);
            }

            triggerFiftyFifty() {
                if (this.jokers.fifty) return;
                this.jokers.fifty = true;
                document.getElementById('jokerFifty').disabled = true;
                this.audio.playTone(500, 'sine', 0.1, 0.2);

                const correct = this.roundQuestions[this.currentIndex].correct;
                const nodes = document.getElementById('optionsGrid').children;
                let eliminated = 0;
                
                let indices = [0, 1, 2, 3].sort(() => 0.5 - Math.random());
                for (let i of indices) {
                    if (i !== correct && eliminated < 2) {
                        nodes[i].classList.add('eliminated-fifty');
                        eliminated++;
                    }
                }
            }

            triggerHint() {
                if (this.jokers.hint || this.currentIndex < 2) return;
                this.jokers.hint = true;
                document.getElementById('jokerHint').disabled = true;
                this.audio.playTone(500, 'sine', 0.1, 0.2);

                document.getElementById('modalBody').innerText = this.roundQuestions[this.currentIndex].hint;
                this.views.modal.classList.remove('hidden');
            }

            triggerGodly() {
                // Güvenlik check'i: 10. sorudan önce tetiklenmesini engelle
                if (this.jokers.godly || this.currentIndex < 10) return;
                this.jokers.godly = true;
                document.getElementById('jokerGodly').disabled = true;

                this.audio.playTone(350, 'sine', 0.08, 0.2);
                setTimeout(() => this.audio.playTone(450, 'sine', 0.08, 0.2), 80);
                setTimeout(() => this.audio.playTone(550, 'sine', 0.08, 0.2), 160);
                setTimeout(() => this.audio.playTone(700, 'sine', 0.25, 0.3), 240);

                const q = this.roundQuestions[this.currentIndex];
                this.handleSelection(q.correct);
            }

            endGameSequence(isVictory) {
                clearInterval(this.timerInterval);
                this.showView('results');

                document.getElementById('resultTitle').innerText = isVictory ? "TEBRİKLER, ATLASI TAMAMLADINIZ!" : "ELENDİNİZ";
                document.getElementById('metricAccuracy').innerText = `${this.currentIndex} / 15`;
                document.getElementById('metricScore').innerText = this.score;
            }

            resetToWelcome() {
                this.showView('welcome');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const engine = new AtlasEngine();
            engine.init();
        });
    </script>
